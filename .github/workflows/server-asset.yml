name: Server asset acceptance

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft/final release tag containing the Linux server asset
        required: true
      release_version:
        description: Application version without the v prefix (for example 3.1.6)
        required: true
      asset_name:
        description: Exact server ZIP asset name
        required: true
      expected_sha256:
        description: SHA256 of the exact server ZIP
        required: true

jobs:
  linux-server:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download exact release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/server-asset"
          gh release download "${{ inputs.release_tag }}" \
            --pattern "${{ inputs.asset_name }}" \
            --dir "$RUNNER_TEMP/server-asset"
          cd "$RUNNER_TEMP/server-asset"
          echo "${{ inputs.expected_sha256 }}  ${{ inputs.asset_name }}" | sha256sum -c -
          unzip -q "${{ inputs.asset_name }}" -d bundle
      - name: Install the exact Linux server bundle
        run: |
          cd "$RUNNER_TEMP/server-asset/bundle/Operon-${{ inputs.release_version }}-Server"
          bash install.sh --prefix "$RUNNER_TEMP/operon" --result "$RUNNER_TEMP/server-install.json"
          python - <<'PY'
          import json, pathlib
          value = json.loads(pathlib.Path('/tmp' if False else __import__('os').environ['RUNNER_TEMP'] + '/server-install.json').read_text())
          assert value['status'] == 'installed', value
          assert pathlib.Path(value['install_dir']).is_dir()
          print(json.dumps(value))
          PY
      - name: Exercise installed CLI and script workflow
        run: |
          python - <<'PY'
          import json, os, pathlib
          v = json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'server-install.json').read_text())
          pathlib.Path(os.environ['RUNNER_TEMP'] + '/operon-path').write_text(v['install_dir'])
          PY
          PREFIX=$(cat "$RUNNER_TEMP/operon-path")
          "$PREFIX/bin/operon" --version
          mkdir -p "$PREFIX/workspace"
          cp -R examples/workflows/script_pipeline "$PREFIX/workspace/demo"
          "$PREFIX/bin/operon" --workspace "$PREFIX/workspace" environment check "$PREFIX/workspace/demo/workflow.yaml" --json
          "$PREFIX/bin/operon" --workspace "$PREFIX/workspace" run "$PREFIX/workspace/demo/workflow.yaml" --progress --brief
          "$PREFIX/bin/operon" --workspace "$PREFIX/workspace" jobs list --json
          "$PREFIX/bin/operon" --workspace "$PREFIX/workspace" service stop || true
      - name: Record installed artifact identity
        run: |
          PREFIX=$(cat "$RUNNER_TEMP/operon-path")
          "$PREFIX/bin/operon" --version
          find "$PREFIX" -maxdepth 2 -type f -name 'server.json' -o -name 'operon-install.json' | sort
