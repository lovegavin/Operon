name: Remaining Windows release checks
on:
  workflow_dispatch:
  push:
    branches: ['release/**']
    paths: ['.github/workflows/release-tail.yml']
permissions:
  contents: read
jobs:
  remaining:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: contracts-desktop
            command: python -m pytest tests/test_manifest_v3.py tests/test_contracts.py tests/test_protocol_v2.py tests/test_sdk_agent.py tests/test_pin_refresh_rebuilt.py tests/test_route_parameters.py tests/test_desktop.py -q
          - name: headless-memory
            command: python -m pytest tests/test_headless_application.py tests/test_wheel_execution.py tests/test_application_library_separation.py tests/test_memory_system.py tests/test_memory_runtime.py -q
          - name: results-export
            command: python -m pytest tests/test_result_viewers.py tests/test_viewer_lifetime.py tests/test_export_domain.py tests/test_export_results.py tests/test_hic_workflow.py -q
          - name: storage-transfer
            command: python -m pytest tests/test_plugin_refresh.py tests/test_transfers.py tests/test_remote_transfer.py tests/test_release_build.py tests/test_release_agent_harness.py tests/test_storage.py tests/test_storage_runtime.py tests/test_service_long_paths.py tests/test_library_install_500.py::test_minimum_application_newer_than_running_is_rejected -q
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -c constraints-py311-windows.txt -e ".[analysis,agent,dev]" "h5py>=3.10" "scikit-learn>=1.4" "biopython>=1.81" "hictkpy>=1.4,<2"
      - run: ${{ matrix.command }}

