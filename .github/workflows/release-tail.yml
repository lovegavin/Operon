name: Remaining Windows release checks
on:
  workflow_dispatch:
  push:
    branches: ['release/**']
    paths: ['.github/workflows/release-tail.yml']
permissions:
  contents: read
jobs:
  remaining:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: metadata-followup
            command: python -m pytest tests/test_manifest_v3.py::test_parameter_update_and_unrelated_install_preserve_metadata tests/test_sdk_agent.py::test_public_schema_files_match_live_models tests/test_plugin_refresh.py::test_refresh_preserves_installed_independent_library_without_reseeding -q
          - name: desktop-launchers
            command: python -m pytest tests/test_desktop.py::test_backend_shutdown_cancels_dependency_preparation tests/test_desktop.py::test_desktop_server_owns_port_and_exits_with_host -q
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -c constraints-py311-windows.txt -e ".[analysis,agent,dev]" "h5py>=3.10" "scikit-learn>=1.4" "biopython>=1.81" "hictkpy>=1.4,<2"
      - uses: actions/setup-node@v4
        if: matrix.name == 'desktop-launchers'
        with:
          node-version: '24'
      - run: npm ci
        if: matrix.name == 'desktop-launchers'
        working-directory: frontend
      - run: npm run build
        if: matrix.name == 'desktop-launchers'
        working-directory: frontend
      - run: ${{ matrix.command }}

