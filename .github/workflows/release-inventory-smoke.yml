name: Final package inventory smoke
on:
  workflow_dispatch:
    inputs:
      wheel_url:
        description: Expiring read-only candidate wheel URL
        required: true
      wheel_sha256:
        description: Exact candidate wheel SHA256
        required: true
      scope:
        description: Changed surface only (inventory, budget or packages)
        default: inventory
        required: true
  push:
    branches: ['release/**']
    paths: ['.github/workflows/release-inventory-smoke.yml']
permissions:
  contents: read
jobs:
  linux-package:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and install exact candidate wheel
        env:
          WHEEL_URL: ${{ inputs.wheel_url }}
          WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
        run: |
          echo "::add-mask::$WHEEL_URL"
          curl --fail --location --silent --show-error "$WHEEL_URL" --output operon_studio-5.2.0-py3-none-any.whl
          echo "$WHEEL_SHA256  operon_studio-5.2.0-py3-none-any.whl" | sha256sum --check
          python -m pip install ./operon_studio-5.2.0-py3-none-any.whl
      - name: Verify changed inventory and delivered schemas only
        env:
          SMOKE_SCOPE: ${{ inputs.scope }}
        run: |
          python - <<'PY'
          import hashlib, json, tempfile, os
          from pathlib import Path
          import operon, operon_sdk
          from operon.environment_store.verification import inventory, verify_inventory
          from operon.contracts.base import ContractError
          assert 'site-packages' in str(operon.__file__)
          if os.environ['SMOKE_SCOPE'] == 'packages':
              from operon.environment_store import EnvironmentStore
              from operon.environment_store.packages import copy_generation, descriptor
              import operon.environment_store.verification as checks
              from operon.contracts.run_plan import EnvironmentRequirement, TargetSpec
              class FixtureBuilder:
                  def resolve(self, requirement): pass
                  def build(self, root, store, **kwargs):
                      (root/'runtime').mkdir()
                      (root/'runtime/tool').write_bytes(b'fixture only')
                      (root/'runtime/tool').chmod(0o755)
                      return {'builder': 'ci-package-fixture'}
                  def verify(self, root, **kwargs):
                      return {'status': 'passed', 'relocation': 'passed', 'synthetic': True}
              with tempfile.TemporaryDirectory() as temp:
                  source = EnvironmentStore(Path(temp)/'source')
                  requirement = EnvironmentRequirement(target=TargetSpec(os='linux', arch='x86_64'), runtime='fixture')
                  binding = source.prepare(requirement, FixtureBuilder())
                  def forbidden(*a, **kw): raise AssertionError('Repeated expanded scan')
                  checks.inventory = forbidden
                  target = EnvironmentStore(Path(temp)/'target')
                  copy_generation(source, target, binding.generation_id)
                  assert target.binding(binding.generation_id) == binding
                  assert (target.root/'generations'/binding.generation_id/'payload/runtime/tool').stat().st_mode & 0o111
              print('PASS: exact installed wheel package copy, cache materialization, executable mode and no expanded rescan; synthetic boundary fixture')
              raise SystemExit(0)
          if os.environ['SMOKE_SCOPE'] == 'budget':
              from operon.export.service import _relocation_probe_timeout
              assert _relocation_probe_timeout(300) == 1260
              assert _relocation_probe_timeout(300, prepare=True) == 1920
              assert _relocation_probe_timeout(100000) == 7200
              print('PASS: exact installed wheel measured relocation budget and hard upper bound')
              raise SystemExit(0)
          assert os.environ['SMOKE_SCOPE'] == 'inventory'
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp) / 'payload'; root.mkdir()
              file = root / 'sample.bin'; file.write_bytes(b'content')
              record = inventory(root)
              assert record['sample.bin']['sha256'] == hashlib.sha256(b'content').hexdigest()
              verify_inventory(root, record)
              file.write_bytes(b'changed')
              try: verify_inventory(root, record)
              except ContractError: pass
              else: raise AssertionError('Corruption accepted')
              outside = Path(tmp) / 'outside'; outside.write_bytes(b'external')
              (root / 'escape').symlink_to(outside)
              try: inventory(root)
              except ContractError: pass
              else: raise AssertionError('External link accepted')
          for name in ['graph', 'workspace']:
              schema = json.loads((Path(operon_sdk.__file__).parent / 'schemas' / (name+'.json')).read_text())
              assert 'StorageInputRef' in schema['$defs']
          print('PASS: exact installed wheel inventory, corruption, external-link boundary and StorageInputRef schemas')
          PY
# Only workflow_dispatch performs this focused gate.
