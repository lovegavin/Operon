[package]
name = "operon-desktop-experimental"
version = "0.1.0"
edition = "2021"
rust-version = "1.100.0"
publish = false

[lib]
name = "operon_desktop_experimental"
path = "src/lib.rs"

[[bin]]
name = "operon-desktop-experimental"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri"]

[dependencies]
tauri = { version = "=2.12.5", optional = true, features = ["tray-icon"] }
tokio = { version = "1", features = ["process", "io-util", "time", "rt-multi-thread", "sync", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
fs2 = "0.4"
sha2 = "0.10"
rfd = "0.15"
open = "5"
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp"] }

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dev-dependencies]
tempfile = "3"
