# Minimal Operon desktop host bridge.
#
# The command permissions are generated by `tauri_build::AppManifest` in
# build.rs. This set only groups them for a runtime capability.
#
# Never grant this set from a static capability or a localhost wildcard. The
# root integration must bind one runtime capability to the exact actual backend
# origin and to the owned main window only. No fs/shell plugin permissions.

[[set]]
identifier = "host"
description = """
Minimal Operon desktop host bridge commands. Grant only from a runtime
capability bound to the exact owned backend origin and the main window; never
a localhost wildcard or an arbitrary remote page.
"""
permissions = [
  "allow-ready",
  "allow-acknowledge-draft-flush",
  "allow-show-diagnostics",
  "allow-request-full-exit",
  "allow-open-committed-artifact",
  "allow-select-path"
]
